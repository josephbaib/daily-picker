<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дейлик: кто говорит</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/app.css?v=6eebc1b-1545">
</head>
<body>
  <div id="fx"></div>
  <div id="room-form" class="screen" hidden>
    <form>
      <h1>Дейлик: кто говорит</h1>
      <p>Придумай имя комнаты для команды. Ссылка с ним будет постоянной.</p>
      <input placeholder="например, ba-team" maxlength="40" autofocus>
      <button type="submit" class="play">Создать или открыть</button>
    </form>
  </div>

  <div id="hub" class="screen" hidden>
    <header class="topbar">
      <div class="logo">Дейлик <button class="room" id="room-name" title="Переименовать команду"></button></div>
      <div class="tools">
        <button id="sound" class="chip">Звук</button>
        <button id="copy" class="chip">Ссылка</button>
      </div>
    </header>
    <div class="hub-body">
      <section class="games">
        <div id="game-tiles" class="game-tiles"></div>
        <div id="game-desc"></div>
        <div class="play-row">
          <button id="start" class="play">Играть</button>
          <div id="memo" class="memo"></div>
        </div>
      </section>
      <section class="team">
        <h2>Команда <span id="count" class="sub"></span></h2>
        <div id="team-grid" class="team-grid"></div>
      </section>
    </div>
  </div>

  <div id="game" class="screen" hidden>
    <canvas id="canvas"></canvas>
    <div id="hud"><span id="hud-title"></span><span id="hud-time"></span></div>
    <div id="overlay" hidden></div>
  </div>

  <div id="result" class="screen" hidden></div>
  <div id="fade"></div>
  <div id="toast" hidden></div>
  <script type="module" src="js/app.js?v=6eebc1b-1545"></script>
</body>
</html>
